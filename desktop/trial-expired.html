<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okres próbny zakończony — Xeomsc-Laser</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;min-height:100%;background:#0b1220;color:#e6edf6;
    font:15px/1.7 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center}
  .card{max-width:520px;margin:40px auto;padding:38px 42px;text-align:center}
  .logo{width:92px;height:auto;margin-bottom:18px;opacity:.95}
  h1{font-size:22px;margin:0 0 12px;color:#f7b733}
  p{margin:0 0 14px;color:#b9c4d6}
  .accent{color:#7dd3fc;font-weight:600}
  .box{margin-top:22px;padding:16px 20px;background:#0f1830;border:1px solid #1e2b48;border-radius:10px}
  .box p{margin:0;color:#e6edf6}
  a.btn{display:inline-block;margin-top:24px;padding:12px 28px;border-radius:8px;
    background:linear-gradient(135deg,#f7b733,#e0892a);color:#1a1304;font-weight:700;
    text-decoration:none}
  a.link{color:#7dd3fc;text-decoration:none}
  a.link:hover{text-decoration:underline}
  .foot{margin-top:18px;font-size:13px;color:#6f7c93}
</style></head>
<body>
  <div class="card">
    <img class="logo" src="app/assets/logo.png" alt="Xeomsc-Laser" onerror="this.style.display='none'">
    <h1>Okres próbny zakończony</h1>
    <p>7-dniowa wersja próbna programu <span class="accent">Xeomsc-Laser</span> dobiegła końca.</p>
    <div class="box">
      <p>Aby kontynuować pracę w edytorze, potrzebna jest pełna wersja licencyjna programu.</p>
    </div>
    <p style="margin-top:22px">Aby uzyskać pełną wersję, skontaktuj się z nami:</p>
    <a class="btn" href="https://xeomsc-laser.pl">Przejdź na stronę xeomsc-laser.pl</a>
    <p class="foot">Xeomsc Laser · <a class="link" href="https://xeomsc-laser.pl">xeomsc-laser.pl</a></p>
  </div>
</body></html>
