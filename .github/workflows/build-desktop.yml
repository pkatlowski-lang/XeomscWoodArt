name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/quirky-gates-xT8ZH
    paths:
      - 'desktop/**'
      - 'edytor.html'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
            artifact: edytor-laser-xeomsc-windows
            files: |
              desktop/dist/*.exe
              desktop/dist/*.blockmap
          - os: macos-latest
            build: npm run dist:mac
            artifact: edytor-laser-xeomsc-macos
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        env:
          CI: true
          # Bez podpisywania (opcjonalne sekrety CSC_* / APPLE_* włączą podpis automatycznie).
        run: ${{ matrix.build }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
