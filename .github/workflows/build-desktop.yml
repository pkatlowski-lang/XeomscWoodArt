name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/quirky-gates-xT8ZH
    paths:
      - 'desktop/**'
      - 'edytor.html'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
            artifact: edytor-laser-xeomsc-windows
            files: |
              desktop/dist/*.exe
              desktop/dist/*.blockmap
          - os: macos-latest
            build: npm run dist:mac
            artifact: edytor-laser-xeomsc-macos
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        env:
          CI: true
          # Bez podpisywania (opcjonalne sekrety CSC_* / APPLE_* włączą podpis automatycznie).
        run: ${{ matrix.build }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Push installers to retrieval branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _dl

      - name: Push installers to temporary branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p _out
          find _dl -type f -name '*.exe' -exec cp {} _out/ \;
          echo "--- pliki do przekazania ---"; ls -la _out
          WORK="$(mktemp -d)"
          cp _out/* "$WORK"/
          cd "$WORK"
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b installers-dist
          git add -f .
          git commit -q -m "installers from run ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin installers-dist

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
